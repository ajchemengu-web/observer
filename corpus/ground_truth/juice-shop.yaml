target: juice-shop

expected_detections:
  - id: no-tls-configured
    description: >
      Juice Shop's default container serves plain HTTP with no TLS
      listener on the mapped port; webcheck's TLS check should fail to
      connect (reported as an INFO-level "TLS check failed" finding)
      rather than silently succeeding or crashing.
    category: tls-weakness
    expected_min_severity: info
    status: unverified
    verified_by: ""
    verified_date: ""
    notes: ""

  - id: open-http-port
    description: "netscan should report the mapped port open with an http-family service."
    category: open-port
    expected_min_severity: info
    status: unverified
    verified_by: ""
    verified_date: ""
    notes: ""

  - id: missing-security-headers
    description: >
      Confirm which of HSTS/CSP/X-Frame-Options/Permissions-Policy are
      actually absent from Juice Shop's default response — do not assume
      which ones without checking; Express middleware configuration
      varies by version.
    category: missing-security-header
    expected_min_severity: low
    status: unverified
    verified_by: ""
    verified_date: ""
    notes: ""

